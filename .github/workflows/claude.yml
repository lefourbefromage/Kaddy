# Claude handles issues and PR comments that mention @claude.
# Only people with write access to the repo can trigger it.
name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Day-to-day work happens on develop; PRs go there, main stays the release branch.
          base_branch: develop
          claude_args: |
            --allowedTools "Bash(npm run lint:*),Bash(npm run build:*),Bash(npx eslint:*),Bash(npx tsc:*),Bash(npx next typegen:*)"

      # On an issue, once Vercel has deployed Claude's branch, post its preview link in the issue.
      # (On a PR, Vercel already comments the link itself.)
      - name: Post Vercel preview link
        if: always() && github.event.issue && !github.event.issue.pull_request && steps.claude.outputs.branch_name
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          sha=$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha 2>/dev/null) || { echo "No pushed branch, nothing to preview"; exit 0; }
          if [ "$(gh api "repos/$REPO/compare/develop...$sha" --jq .ahead_by)" = "0" ]; then echo "No commits, nothing to preview"; exit 0; fi
          # Vercel usually deploys in 1-3 minutes; wait up to 10.
          for i in $(seq 1 40); do
            state=$(gh api "repos/$REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // ""')
            [ "$state" = success ] || [ "$state" = failure ] || [ "$state" = error ] && break
            sleep 15
          done
          if [ "$state" != success ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ Le déploiement Vercel de \`$BRANCH\` n'a pas abouti (état : ${state:-aucun}). Détails dans l'onglet Checks du commit ${sha:0:7}."
            exit 0
          fi
          # The branch's preview host is in the summary of Vercel's "Preview Comments" check.
          host=$(gh api "repos/$REPO/commits/$sha/check-runs" --jq '.check_runs[] | select(.app.slug == "vercel") | .output.summary // ""' | grep -oE '[a-z0-9-]+\.vercel\.app' | head -1)
          if [ -n "$host" ]; then url="https://$host"; else url=$(gh api "repos/$REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "Vercel")][0].target_url'); fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "🔗 **Preview à tester :** $url
          Branche \`$BRANCH\` · commit ${sha:0:7} · [Créer la PR vers develop](https://github.com/$REPO/compare/develop...$BRANCH?expand=1)"
